{% extends "base.html" %}

{% block title %}Create Event{% endblock %}

{% block content %}

<h1>Create Event</h1>

<form method="POST">

    <label>Title</label>
    <input type="text" name="title" required>

    <label>Date</label>
    <input type="date" name="event_date" required>

    <label>Location</label>
    <input type="text" name="location" required>

    <button type="submit">Create</button>

</form>

{% endblock %}
